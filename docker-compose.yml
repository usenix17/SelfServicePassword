services:
  ldap-self-service:
    build:
      context: .
      args:
        # Override REGISTRY in a local .env to pull base images through a
        # mirror/proxy-cache, e.g. REGISTRY=registry.starnix.net/docker/library
        REGISTRY: ${REGISTRY:-docker.io/library}
    ports:
      - "8081:8081"
    environment:
      - GIN_MODE=release
    volumes:
      - ./config.yaml:/root/config.yaml:ro
    restart: unless-stopped
    network_mode: host  # Use host networking to access LDAP server at 192.168.1.24
